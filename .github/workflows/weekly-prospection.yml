name: Prospection hebdomadaire Omniscient

on:
  schedule:
    - cron: 'CRON_TZ=Africa/Casablanca 0 9 * * 1-5'  # Lun-Ven 9h Maroc
  workflow_dispatch:

jobs:
  prospect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Installer anthropic
        run: pip install anthropic

      - name: Générer et envoyer les emails
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: python3 prospection/weekly_send.py

      - name: Mettre à jour targets.json
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add prospection/targets.json
          git diff --staged --quiet || git commit -m "prospection: $(date +%Y-%m-%d) — envoi quotidien"
          git push
