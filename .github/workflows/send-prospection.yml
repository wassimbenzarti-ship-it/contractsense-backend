name: Envoi emails prospection Omniscient

on:
  push:
    paths:
      - 'prospection/emails_to_send.json'
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Envoyer les emails via OVH SMTP
        env:
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: python3 prospection/send_emails.py
